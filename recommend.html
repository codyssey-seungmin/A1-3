<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 책 추천 - 오늘의 책, AI 사서</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/recommend.css" />
</head>
<body>
  <header class="site-header">
    <div class="nav-wrap">
      <a href="index.html" class="logo">오늘의 책, AI 사서</a>
      <button class="nav-toggle" aria-label="메뉴 열기" aria-expanded="false">&#9776;</button>
      <ul class="nav-menu">
        <li><a href="index.html">홈</a></li>
        <li><a href="recommend.html" aria-current="page">AI 책 추천</a></li>
        <li><a href="about.html">소개</a></li>
        <li><a href="faq.html">FAQ</a></li>
      </ul>
    </div>
  </header>

  <main class="container">
    <h1>AI 책 추천 받기</h1>
    <p class="page-desc">오늘의 기분과 취향을 알려주시면 AI 사서가 책 3권을 추천해드려요.</p>

    <!-- ========================================
         입력 폼: 기분 / 장르 / 읽을 수 있는 시간
         3개 항목 모두 필수값으로, 비어있으면 js에서 막고 안내 메시지를 보여준다.
    ======================================== -->
    <form id="recommend-form" class="recommend-form" novalidate>
      <div class="form-row">
        <label for="mood">오늘 기분은 어떤가요?</label>
        <select id="mood" name="mood">
          <option value="">기분을 선택하세요</option>
          <option value="기쁨">기쁨 / 신남</option>
          <option value="우울">우울 / 지침</option>
          <option value="편안">편안 / 안정</option>
          <option value="설렘">설렘 / 기대</option>
          <option value="무기력">무기력 / 심심함</option>
        </select>
      </div>

      <div class="form-row">
        <label for="genre">좋아하는 장르나 소재를 알려주세요</label>
        <input
          type="text"
          id="genre"
          name="genre"
          placeholder="예: 판타지, 에세이, 추리소설, 자기계발"
          autocomplete="off"
        />
      </div>

      <div class="form-row">
        <label for="time">오늘 읽을 수 있는 시간은요?</label>
        <select id="time" name="time">
          <option value="">시간을 선택하세요</option>
          <option value="10분 이내">10분 이내 (자투리 시간)</option>
          <option value="30분 정도">30분 정도</option>
          <option value="1시간 이상">1시간 이상 (여유로움)</option>
        </select>
      </div>

      <!-- 입력 오류/서버 오류/지연 메시지를 보여주는 공용 영역 -->
      <p id="form-message" class="form-message" role="alert" aria-live="polite"></p>

      <button type="submit" class="btn" id="submit-btn">추천받기</button>
    </form>

    <!-- ========================================
         결과 영역: 로딩 중 / 추천 카드 3개를 상황에 따라 보여준다.
         평소에는 비어있다가 js가 내용을 채워 넣는다.
    ======================================== -->
    <section id="result-area" class="result-area" aria-live="polite"></section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 오늘의 책, AI 사서. Codyssey 미션 프로젝트.</p>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/recommend.js"></script>
</body>
</html>
