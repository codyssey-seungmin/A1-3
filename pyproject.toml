# Vercel이 pyproject.toml을 발견하면 uv로 의존성을 설치하므로,
# uv가 요구하는 [project] 정보와 실제 의존성(requirements.txt와 동일)을 함께 명시한다.
[project]
name = "a1-3"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-genai",
]

# api/recommend.py 안의 handler를 서버리스 함수 진입점으로 인식하도록 명시한다.
[tool.vercel]
entrypoint = "api.recommend:handler"
